name: Bug
description: Report incorrect accepted or released behaviour.
title: "[Bug] "
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What user, economic, security, data, or operational harm can this cause?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / data context
      description: Environment, account type, relevant data conditions, browser/device, release or commit if known.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, failing tests, example values or other evidence. Remove secrets and personal data.
  - type: textarea
    id: regression
    attributes:
      label: Regression / scope
      description: Did this work before? What related areas might be affected?
  - type: checkboxes
    id: critical
    attributes:
      label: Critical checks
      options:
        - label: This may affect financial/economic calculation correctness.
        - label: This may affect data integrity.
        - label: This may affect security or access control.
